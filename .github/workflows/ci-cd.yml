name: CI/CD Pipeline for Enhanced Multi-Tier Cloud Simulation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Install Maven
      - name: Install Maven
        run: |
          sudo apt update
          sudo apt install -y maven

      # Step 4: Build the project
      - name: Build Project
        run: mvn clean package

      # Step 5: Run the simulation
      - name: Run Simulation
        run: |
          mkdir output
          mvn exec:java -pl modules/cloudsim-examples/ -Dexec.mainClass=org.cloudbus.cloudsim.examples.EnhancedMultiTierCloudSimulation
          mv cloudlet_execution_results.png output/

      # Step 6: Upload visualization as an artifact
      - name: Upload Visualization Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudlet-execution-results
          path: output/cloudlet_execution_results.png